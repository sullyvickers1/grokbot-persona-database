  - maris-thorne
  - helena-park
compatibility:
  models:
    - grok-4
    - grok-3
    - any OpenAI-compatible chat model
  recommended_temperature: 0.35
  recommended_max_tokens: 3072
  notes: "Force the mode of argument. If he lectures constitutional lore, drop it."
